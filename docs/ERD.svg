<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="erdCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1150" height="720" fill="#090d16"/>
  <rect x="20" y="20" width="1110" height="680" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="60" font-size="20" font-weight="800" fill="#f8fafc">IPMS ELITE — ENTITY RELATIONSHIP DIAGRAM (ERD)</text>
  <text x="50" y="80" font-size="12" fill="#94a3b8">PostgreSQL 15 Relational Schema with Foreign Keys &amp; RLS Boundaries</text>

  <!-- TABLE: PROFILES -->
  <g transform="translate(50, 110)" filter="url(#cardShadow)">
    <rect width="240" height="230" rx="10" fill="url(#erdCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 0 0 L 240 0 L 240 32 L 0 32 Z" fill="#38bdf8" clip-path="inset(0 0 0 0 round 10 10 0 0)"/>
    <text x="12" y="22" font-size="13" font-weight="800" fill="#090d16">profiles (Student Candidates)</text>
    <text x="14" y="52" font-size="11" fill="#f8fafc" font-family="monospace">🔑 id : uuid (PK, FK auth)</text>
    <text x="14" y="72" font-size="11" fill="#cbd5e1" font-family="monospace">• name : text</text>
    <text x="14" y="92" font-size="11" fill="#cbd5e1" font-family="monospace">• email : text</text>
    <text x="14" y="112" font-size="11" fill="#cbd5e1" font-family="monospace">• usn : text (UNIQUE)</text>
    <text x="14" y="132" font-size="11" fill="#cbd5e1" font-family="monospace">• branch : text</text>
    <text x="14" y="152" font-size="11" fill="#cbd5e1" font-family="monospace">• cgpa : numeric(4,2)</text>
    <text x="14" y="172" font-size="11" fill="#cbd5e1" font-family="monospace">• backlogs : integer</text>
    <text x="14" y="192" font-size="11" fill="#cbd5e1" font-family="monospace">• resume_url : text</text>
    <text x="14" y="212" font-size="11" fill="#cbd5e1" font-family="monospace">• skills : text[]</text>
  </g>

  <!-- TABLE: COMPANIES -->
  <g transform="translate(450, 110)" filter="url(#cardShadow)">
    <rect width="250" height="210" rx="10" fill="url(#erdCard)" stroke="#a855f7" stroke-width="1.5"/>
    <path d="M 0 0 L 250 0 L 250 32 L 0 32 Z" fill="#a855f7" clip-path="inset(0 0 0 0 round 10 10 0 0)"/>
    <text x="12" y="22" font-size="13" font-weight="800" fill="#090d16">companies (Visiting Recruiters)</text>
    <text x="14" y="52" font-size="11" fill="#f8fafc" font-family="monospace">🔑 id : uuid (PK)</text>
    <text x="14" y="72" font-size="11" fill="#cbd5e1" font-family="monospace">• name : text</text>
    <text x="14" y="92" font-size="11" fill="#cbd5e1" font-family="monospace">• job_role : text</text>
    <text x="14" y="112" font-size="11" fill="#cbd5e1" font-family="monospace">• salary_package : text</text>
    <text x="14" y="132" font-size="11" fill="#cbd5e1" font-family="monospace">• eligibility_criteria : jsonb</text>
    <text x="14" y="152" font-size="11" fill="#cbd5e1" font-family="monospace">• allowed_branches : text[]</text>
    <text x="14" y="172" font-size="11" fill="#cbd5e1" font-family="monospace">• max_backlogs : integer</text>
    <text x="14" y="192" font-size="11" fill="#cbd5e1" font-family="monospace">🔗 user_id : uuid (FK auth)</text>
  </g>

  <!-- TABLE: TESTS -->
  <g transform="translate(840, 110)" filter="url(#cardShadow)">
    <rect width="250" height="210" rx="10" fill="url(#erdCard)" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 0 0 L 250 0 L 250 32 L 0 32 Z" fill="#10b981" clip-path="inset(0 0 0 0 round 10 10 0 0)"/>
    <text x="12" y="22" font-size="13" font-weight="800" fill="#090d16">tests (Assessments)</text>
    <text x="14" y="52" font-size="11" fill="#f8fafc" font-family="monospace">🔑 id : uuid (PK)</text>
    <text x="14" y="72" font-size="11" fill="#cbd5e1" font-family="monospace">• title : text</text>
    <text x="14" y="92" font-size="11" fill="#cbd5e1" font-family="monospace">🔗 company_id : uuid (FK)</text>
    <text x="14" y="112" font-size="11" fill="#cbd5e1" font-family="monospace">• duration : integer (mins)</text>
    <text x="14" y="132" font-size="11" fill="#cbd5e1" font-family="monospace">• scheduled_date : timestamptz</text>
    <text x="14" y="152" font-size="11" fill="#cbd5e1" font-family="monospace">• question_bank : jsonb</text>
    <text x="14" y="172" font-size="11" fill="#cbd5e1" font-family="monospace">• pass_criteria : jsonb</text>
    <text x="14" y="192" font-size="11" fill="#cbd5e1" font-family="monospace">• proctor_config : jsonb</text>
  </g>

  <!-- TABLE: TEST_ATTEMPTS -->
  <g transform="translate(50, 420)" filter="url(#cardShadow)">
    <rect width="260" height="230" rx="10" fill="url(#erdCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M 0 0 L 260 0 L 260 32 L 0 32 Z" fill="#f59e0b" clip-path="inset(0 0 0 0 round 10 10 0 0)"/>
    <text x="12" y="22" font-size="13" font-weight="800" fill="#090d16">test_attempts (Exam Logs)</text>
    <text x="14" y="52" font-size="11" fill="#f8fafc" font-family="monospace">🔑 id : uuid (PK)</text>
    <text x="14" y="72" font-size="11" fill="#cbd5e1" font-family="monospace">🔗 test_id : uuid (FK tests)</text>
    <text x="14" y="92" font-size="11" fill="#cbd5e1" font-family="monospace">🔗 student_id : uuid (FK profiles)</text>
    <text x="14" y="112" font-size="11" fill="#cbd5e1" font-family="monospace">• total_score : numeric</text>
    <text x="14" y="132" font-size="11" fill="#cbd5e1" font-family="monospace">• passed : boolean</text>
    <text x="14" y="152" font-size="11" fill="#cbd5e1" font-family="monospace">• tab_switches : integer</text>
    <text x="14" y="172" font-size="11" fill="#cbd5e1" font-family="monospace">• auto_submitted : boolean</text>
    <text x="14" y="192" font-size="11" fill="#cbd5e1" font-family="monospace">• proctor_events : jsonb</text>
    <text x="14" y="212" font-size="11" fill="#cbd5e1" font-family="monospace">• completed_at : timestamptz</text>
  </g>

  <!-- TABLE: DRIVE_ROUNDS -->
  <g transform="translate(450, 420)" filter="url(#cardShadow)">
    <rect width="250" height="210" rx="10" fill="url(#erdCard)" stroke="#ec4899" stroke-width="1.5"/>
    <path d="M 0 0 L 250 0 L 250 32 L 0 32 Z" fill="#ec4899" clip-path="inset(0 0 0 0 round 10 10 0 0)"/>
    <text x="12" y="22" font-size="13" font-weight="800" fill="#090d16">drive_rounds (Pipeline Stages)</text>
    <text x="14" y="52" font-size="11" fill="#f8fafc" font-family="monospace">🔑 id : uuid (PK)</text>
    <text x="14" y="72" font-size="11" fill="#cbd5e1" font-family="monospace">🔗 company_id : uuid (FK companies)</text>
    <text x="14" y="92" font-size="11" fill="#cbd5e1" font-family="monospace">• round_number : integer</text>
    <text x="14" y="112" font-size="11" fill="#cbd5e1" font-family="monospace">• round_name : text</text>
    <text x="14" y="132" font-size="11" fill="#cbd5e1" font-family="monospace">• round_type : text (test/interview)</text>
    <text x="14" y="152" font-size="11" fill="#cbd5e1" font-family="monospace">• passing_logic : text (cutoff/top_n)</text>
    <text x="14" y="172" font-size="11" fill="#cbd5e1" font-family="monospace">• passing_value : numeric</text>
    <text x="14" y="192" font-size="11" fill="#cbd5e1" font-family="monospace">• auto_progress : boolean</text>
  </g>

  <!-- TABLE: ROUND_PARTICIPANTS -->
  <g transform="translate(840, 420)" filter="url(#cardShadow)">
    <rect width="250" height="210" rx="10" fill="url(#erdCard)" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M 0 0 L 250 0 L 250 32 L 0 32 Z" fill="#6366f1" clip-path="inset(0 0 0 0 round 10 10 0 0)"/>
    <text x="12" y="22" font-size="13" font-weight="800" fill="#090d16">round_participants (Gating)</text>
    <text x="14" y="52" font-size="11" fill="#f8fafc" font-family="monospace">🔑 id : uuid (PK)</text>
    <text x="14" y="72" font-size="11" fill="#cbd5e1" font-family="monospace">🔗 drive_round_id : uuid (FK)</text>
    <text x="14" y="92" font-size="11" fill="#cbd5e1" font-family="monospace">🔗 student_id : uuid (FK profiles)</text>
    <text x="14" y="112" font-size="11" fill="#cbd5e1" font-family="monospace">• status : qualified | not_qualified</text>
    <text x="14" y="132" font-size="11" fill="#cbd5e1" font-family="monospace">• score : numeric</text>
    <text x="14" y="152" font-size="11" fill="#cbd5e1" font-family="monospace">• recruiter_notes : text</text>
    <text x="14" y="172" font-size="11" fill="#cbd5e1" font-family="monospace">• evaluated_by : uuid</text>
    <text x="14" y="192" font-size="11" fill="#cbd5e1" font-family="monospace">• evaluated_at : timestamptz</text>
  </g>

  <!-- RELATIONSHIP LINES -->
  <!-- companies -> tests (1:N) -->
  <path d="M 700 200 L 840 200" stroke="#10b981" stroke-width="2"/>
  <circle cx="700" cy="200" r="4" fill="#10b981"/>
  <polygon points="832,196 840,200 832,204" fill="#10b981"/>
  <text x="760" y="192" font-size="10" fill="#94a3b8" text-anchor="middle">1 : N</text>

  <!-- companies -> drive_rounds (1:N) -->
  <path d="M 575 320 L 575 420" stroke="#ec4899" stroke-width="2"/>
  <circle cx="575" cy="320" r="4" fill="#ec4899"/>
  <polygon points="571,412 575,420 579,412" fill="#ec4899"/>
  <text x="590" y="375" font-size="10" fill="#94a3b8">1 : N</text>

  <!-- tests -> test_attempts (1:N) -->
  <path d="M 965 320 L 965 370 L 310 370 L 310 460" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <polygon points="306,452 310,460 314,452" fill="#f59e0b"/>
  <text x="630" y="365" font-size="10" fill="#94a3b8">1 : N (tests &rarr; attempts)</text>

  <!-- profiles -> test_attempts (1:N) -->
  <path d="M 170 340 L 170 420" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="170" cy="340" r="4" fill="#38bdf8"/>
  <polygon points="166,412 170,420 174,412" fill="#38bdf8"/>
  <text x="185" y="380" font-size="10" fill="#94a3b8">1 : N</text>

  <!-- drive_rounds -> round_participants (1:N) -->
  <path d="M 700 520 L 840 520" stroke="#6366f1" stroke-width="2"/>
  <circle cx="700" cy="520" r="4" fill="#6366f1"/>
  <polygon points="832,516 840,520 832,524" fill="#6366f1"/>
  <text x="770" y="512" font-size="10" fill="#94a3b8" text-anchor="middle">1 : N</text>
</svg>
