<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="680" fill="url(#bgGlow)" />
  <rect x="25" y="25" width="1050" height="630" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Section -->
  <text x="50" y="65" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">IPMS ELITE — SYSTEM ARCHITECTURE DIAGRAM</text>
  <text x="50" y="90" font-size="13" font-weight="400" fill="#94a3b8">Enterprise Autonomous Campus Placement &amp; AI Anti-Cheat Ecosystem</text>
  <rect x="910" y="45" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="980" y="65" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">VERSION 3.0</text>

  <!-- SECTION 1: PRESENTATION LAYER (SPA) -->
  <g transform="translate(50, 120)">
    <rect width="450" height="240" rx="14" fill="url(#blueCard)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="0" filter="drop-shadow(0 4px 20px rgba(56,189,248,0.15))" />
    <rect x="18" y="16" width="8" height="22" rx="4" fill="#38bdf8" />
    <text x="36" y="32" font-size="15" font-weight="700" fill="#f8fafc">1. WEB PRESENTATION TIER (React 18 SPA)</text>
    
    <!-- Sub-cards -->
    <rect x="20" y="55" width="195" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="32" y="80" font-size="13" font-weight="700" fill="#38bdf8">🎓 Student Portal</text>
    <text x="32" y="100" font-size="11" fill="#94a3b8">• Profile Studio &amp; Quotas</text>
    <text x="32" y="116" font-size="11" fill="#94a3b8">• Proctored Assessment Hub</text>

    <rect x="235" y="55" width="195" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="247" y="80" font-size="13" font-weight="700" fill="#a855f7">🏛️ Admin Console</text>
    <text x="247" y="100" font-size="11" fill="#94a3b8">• Recruiter Invitation Engine</text>
    <text x="247" y="116" font-size="11" fill="#94a3b8">• AI Question Bank Builder</text>

    <rect x="20" y="145" width="195" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="32" y="170" font-size="13" font-weight="700" fill="#10b981">🏢 Company Recruiter</text>
    <text x="32" y="190" font-size="11" fill="#94a3b8">• Multi-Round Drive Pipeline</text>
    <text x="32" y="206" font-size="11" fill="#94a3b8">• Passing Logic &amp; Gating</text>

    <rect x="235" y="145" width="195" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="247" y="170" font-size="13" font-weight="700" fill="#f59e0b">🤖 Placement Oracle</text>
    <text x="247" y="190" font-size="11" fill="#94a3b8">• Remark-GFM Tables</text>
    <text x="247" y="206" font-size="11" fill="#94a3b8">• Live Recharts Bar Charts</text>
  </g>

  <!-- SECTION 2: CLIENT VISION PROCTORING (RAM / WebGL) -->
  <g transform="translate(50, 390)">
    <rect width="450" height="230" rx="14" fill="url(#blueCard)" stroke="#ec4899" stroke-width="1.5" />
    <rect x="18" y="16" width="8" height="22" rx="4" fill="#ec4899" />
    <text x="36" y="32" font-size="15" font-weight="700" fill="#f8fafc">2. AI COMPUTER VISION ENGINE (100% Client-Side)</text>

    <rect x="20" y="55" width="410" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="35" y="85" font-size="13" font-weight="700" fill="#ec4899">TensorFlow.js COCO-SSD (MobileNetV2)</text>
    <text x="35" y="108" font-size="11.5" fill="#cbd5e1">• WebCam Video Stream analyzed in RAM (Zero Video Uploads)</text>
    <text x="35" y="128" font-size="11.5" fill="#cbd5e1">• Detects Cell Phones, Tablets &amp; Laptops (Confidence &gt; 65%)</text>
    <text x="35" y="148" font-size="11.5" fill="#cbd5e1">• Tab Switch Telemetry Counter (Warning at 1, Auto-Submit at 3)</text>
    <text x="35" y="168" font-size="11.5" fill="#cbd5e1">• Mathematical Proctor Score: S = 100 - (Tabs*15) - (Gadgets*40)</text>
    <text x="35" y="188" font-size="11" font-weight="600" fill="#10b981">✓ Fully Privacy-Preserving • Latency: 60ms • Zero Server Storage</text>
  </g>

  <!-- SECTION 3: SERVERLESS API & EDGE RELAY -->
  <g transform="translate(600, 120)">
    <rect width="450" height="240" rx="14" fill="url(#blueCard)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="18" y="16" width="8" height="22" rx="4" fill="#818cf8" />
    <text x="36" y="32" font-size="15" font-weight="700" fill="#f8fafc">3. SERVERLESS EDGE &amp; AI RELAYS</text>

    <rect x="20" y="55" width="410" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="35" y="80" font-size="13" font-weight="700" fill="#818cf8">POST /api/gemini (AI Proxy Relay)</text>
    <text x="35" y="100" font-size="11.5" fill="#cbd5e1">• Bidirectional LLM Gateway: Groq Llama 3 &amp; Google Gemini 2.5</text>
    <text x="35" y="116" font-size="11.5" fill="#cbd5e1">• Zero Browser Key Leaks • Automatic Fallback Rotation</text>

    <rect x="20" y="145" width="410" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="35" y="170" font-size="13" font-weight="700" fill="#38bdf8">POST /api/send-email (SMTP Gateway)</text>
    <text x="35" y="190" font-size="11.5" fill="#cbd5e1">• Nodemailer IPv4 Transport for Automated Recruiter Invites</text>
    <text x="35" y="206" font-size="11.5" fill="#cbd5e1">• Round Qualification Email Notifications to Candidates</text>
  </g>

  <!-- SECTION 4: DATA PERSISTENCE & SECURITY (SUPABASE) -->
  <g transform="translate(600, 390)">
    <rect width="450" height="230" rx="14" fill="url(#blueCard)" stroke="#10b981" stroke-width="1.5" />
    <rect x="18" y="16" width="8" height="22" rx="4" fill="#10b981" />
    <text x="36" y="32" font-size="15" font-weight="700" fill="#f8fafc">4. DATA PERSISTENCE &amp; RLS (Supabase PostgreSQL 15)</text>

    <rect x="20" y="55" width="195" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="32" y="78" font-size="12" font-weight="700" fill="#10b981">Relational Database</text>
    <text x="32" y="96" font-size="11" fill="#94a3b8">• profiles, companies</text>
    <text x="32" y="112" font-size="11" fill="#94a3b8">• tests, test_attempts</text>

    <rect x="235" y="55" width="195" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="247" y="78" font-size="12" font-weight="700" fill="#10b981">Recruitment Drives</text>
    <text x="247" y="96" font-size="11" fill="#94a3b8">• drive_rounds</text>
    <text x="247" y="112" font-size="11" fill="#94a3b8">• round_participants</text>

    <rect x="20" y="145" width="195" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="32" y="168" font-size="12" font-weight="700" fill="#38bdf8">Row Level Security</text>
    <text x="32" y="186" font-size="10.5" fill="#94a3b8">PostgreSQL RLS Active</text>
    <text x="32" y="198" font-size="10.5" fill="#94a3b8">Zero Peer Data Leaks</text>

    <rect x="235" y="145" width="195" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="247" y="168" font-size="12" font-weight="700" fill="#f59e0b">Storage Buckets</text>
    <text x="247" y="186" font-size="10.5" fill="#94a3b8">resumes (≤1MB)</text>
    <text x="247" y="198" font-size="10.5" fill="#94a3b8">certificates (≤800KB)</text>
  </g>

  <!-- CONNECTIONS & ARROWS -->
  <!-- Arrow 1: SPA to Serverless -->
  <path d="M 500 240 L 600 240" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="598,236 606,240 598,244" fill="#818cf8" />
  <rect x="520" y="222" width="60" height="18" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="0.8" />
  <text x="550" y="235" font-size="10" font-weight="600" fill="#818cf8" text-anchor="middle">HTTPS</text>

  <!-- Arrow 2: SPA to Supabase -->
  <path d="M 450 360 L 600 450" stroke="#10b981" stroke-width="2" />
  <polygon points="593,446 601,451 596,455" fill="#10b981" />
  <rect x="490" y="395" width="70" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
  <text x="525" y="408" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">PostgREST</text>

  <!-- Arrow 3: Vision to SPA Telemetry -->
  <path d="M 275 390 L 275 360" stroke="#ec4899" stroke-width="2" />
  <polygon points="271,364 275,356 279,364" fill="#ec4899" />
  <rect x="230" y="367" width="90" height="16" rx="4" fill="#0f172a" stroke="#ec4899" stroke-width="0.8" />
  <text x="275" y="379" font-size="9" font-weight="600" fill="#ec4899" text-anchor="middle">proctor_events</text>
</svg>
